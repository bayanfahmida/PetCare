<!DOCTYPE html>
<html>

<head >

    <title >Pet Owner Registration</title>

</head>

<body>
    <center>

    <h1>PetCare</h1>

    <h2>Pet Owner Registration Form</h2>

    <hr>

    <h2>Join as a Pet Owner</h2>

    <p>
        Share your love and help your pet find a new home.
    </p>

    <br>


    <form>

        <label>Full Name</label>
        <br>

        <input type="text" placeholder="Enter your full name">

        <br><br>


        <label>Email Address</label>
        <br>

        <input type="email" placeholder="Enter your email">

        <br><br>


        <label>Phone Number</label>
        <br>

        <input type="text" placeholder="Enter your phone number">

        <br><br>


        <label>Password</label>
        <br>

        <input type="password" placeholder="Create a password">

        <br><br>


        <label>Confirm Password</label>
        <br>

        <input type="password" placeholder="Confirm your password">

        <br><br>


        <label>Address / Location</label>
        <br>

        <textarea rows="4" cols="40"
            placeholder="Enter your address or general location"></textarea>

        <br><br>


        <input type="checkbox">

        <label>
            I agree to the platform guidelines and terms of service.
        </label>

        <br><br>


        <button type="submit">
            Register as Pet Owner
        </button>

    </form>


    <br>

           Already have an account? <a href="../../commonui/view/login.html">Login</a>

   


    <hr>

    <p>
        Pet Care & Adoption Platform &copy; 2026
    </p>

    </center>


</body>

</html>
