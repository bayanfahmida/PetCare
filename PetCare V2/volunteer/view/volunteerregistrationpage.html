
<!DOCTYPE html>
<html>
<head>
    <title>PetCare - Volunteer Registration</title>
</head>
<body>
    <center>
        <h1>PetCare</h1>
        <h2>Volunteer Registration Form</h2>
        <p>Join us and help animals in need!</p>
        <hr>
    </center>

    <form>
     <center>
        <label>Full Name:</label>
        <input type="text" name="fullname">
        <br><br>

        <label>Email Address:</label>
        <input type="text" name="email">
        <br><br>

        <label>Phone Number:</label>
        <input type="text" name="phone">
        <br><br>

        <label>Password:</label>
        <input type="password" name="password">
        <br><br>

        <label>Age:</label>
        <input type="number" name="age">
        <br><br>

        <label>Why do you want to volunteer?</label> <br>
        <textarea></textarea>
        <br><br>

        <label>Availability:</label><br>
        <input type="radio" name="availability" value="Weekdays"> Weekdays
        <br>
        <input type="radio" name="availability" value="Weekends"> Weekends
        <br>
        <input type="radio" name="availability" value="Both">Both
        <br><br>

        <input type="checkbox">I agree to the volunteer guidelines.
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">

<br><br>

Already have an account? <a href="../../commonui/view/login.html">Login</a>

    </center>
    </form>

    <br>



</body>
</html>
