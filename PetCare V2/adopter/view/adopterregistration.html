<html>

<head>
    <title>Adopter Registration - PetCare</title>
</head>

<body>
    <h1 align="center">PetCare</h1>
    <h2 align="center">Adopter Registration</h2>
    <p align="center">Give a pet a loving home!</p>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <table align="center">
                <tr>
                    <td>
                        <label for="fullname">Full Name:</label>
                    </td>
                    <td>
                        <input type="text" id="fullname" name="fullname" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="email">Email Address:</label>
                    </td>
                    <td>
                        <input type="email" id="email" name="email" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="phone">Phone Number:</label>
                    </td>
                    <td>
                        <input type="tel" id="phone" name="phone" pattern="01[0-9]{9}" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="dob">Date of Birth:</label>
                    </td>
                    <td>
                        <input type="date" id="dob" name="dob" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="address">Address:</label>
                    </td>
                    <td>
                        <textarea id="address" name="address" rows="3" cols="25" required></textarea>
                    </td>
                </tr>

            </table>
        </fieldset>
            
        <fieldset>
            <legend>Account Security</legend>    
            <table align="center">
                <tr>
                    <td>
                        <label for="password">Password:</label>
                    </td>
                    <td>
                        <input type="password" id="password" name="password" minlength="8" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="confirm_password">Confirm Password:</label>
                    </td>
                    <td>
                        <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
                    </td>
                </tr>
            </table>
        </fieldset>
        <fieldset>
            <legend>Pet Adoption Information</legend>
            <table align="center">
                <tr>
                    <td>
                        <label for="pettype">Preferred Pet:</label>
                    </td>
                    <td>
                        <select id="pettype" name="pettype">
                            <option value="">Select a pet type</option>
                            <option value="dog">Dog</option>
                            <option value="cat">Cat</option>
                            <option value="bird">Bird</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label>Have you owned a pet before?</label>
                    </td>
                    <td>
                        <input type="radio" id="yes" name="experience" value="yes">
                        <label for="yes">Yes</label>    
                        <input type="radio" id="no" name="experience" value="no">  
                        <label for="no">No</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="home">Home Environment:</label>
                    </td>
                    <td>
                        <select id="home" name="home">
                            <option value="">Select environment</option>
                            <option value="house">House</option>
                            <option value="apartment">Apartment</option>
                            <option value="other">Other</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="reason">Why do you want to adopt?</label>
                    </td>
                    <td>
                        <textarea id="reason" name="reason" rows="4" cols="40"></textarea>
                    </td>
                </tr>

            </table>
        </fieldset>
        <table align="center">
            <tr>
                <td colspan="2" align="center">
                    <input type="checkbox" id="guidelines" name="guidelines" required>
                    <label for="guidelines"> I agree to follow the adoption guidelines </label>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                    <input type="reset" value="Clear">
                </td>
            </tr>

        </table>

    </form>
<center>
   Already have an account? <a href="../../commonui/view/login.html">Login</a>
</center>

</body>
</html>
