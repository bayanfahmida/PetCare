
<html>
<head>
    <title>Pet Care - Login</title>
</head>
<body>

    <h1 align="center">Welcome</h1>
    <h2 align="center">Login to your pet care's hub</h2>

    <form>
        <table align="center">
            <tr>
                <td><label for="email">Email:</label></td>
                <td>
                    <input type="email" id="email" name="email" required>
                </td>
            </tr>

            <tr>
                <td><label for="password">Password:</label></td>
                <td>
                    <input type="password" id="password" name="password" required>
                </td>
            </tr>

             <tr>
                <td><label for="role">Choose Role:</label></td>
                <td>
                    <select id="role" name="role" required>
                        <option value="">Select your role</option>
                        <option value="adopter">Adopter</option>
                        <option value="pet_owner">Pet Owner</option>
                        <option value="volunteer">Volunteer</option>
                        <option value="admin">Admin</option>
                    </select>
                </td>
            </tr>
            
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Login">
                    <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>

    
<p align="center">Don't have an account? Register as:</p>

<table align="center">
    <tr>
        <td>
            <a href="../../adopter/view/adopterregistration.html">Adopter</a>
        </td>
        <td>
            <a href="../../petowner/view/petownerregistration.html">Pet Owner</a>
        </td>
    </tr>

    <tr>
        <td>
            <a href="../../volunteer/view/volunteerregistrationpage.html">Volunteer</a>
        </td>
        <td>
            <a href="../../admin/view/adminregistration.html">Admin</a>
        </td>
    </tr>
</table>


</body>
</html>
